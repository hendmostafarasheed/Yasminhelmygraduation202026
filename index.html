<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6d160f">
<meta name="description" content="دعوة تخرج ياسمين حلمي - كلية الإعلام، جامعة القاهرة">
<title>دعوة تخرج | ياسمين حلمي</title>
<style>
:root{--wine:#761810;--gold:#b08343;--cream:#f7edda;--ink:#482617}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#efe2cb;color:var(--ink);font-family:Tahoma,Arial,sans-serif;min-height:100vh;min-height:100svh}
main{width:100%;min-height:100vh;min-height:100svh;margin:0 auto;padding:12px 10px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.screen{display:none;position:relative;width:min(100%,780px,calc((100svh - 155px)*0.743));line-height:0;margin:auto 0}
.screen.active{display:block}
.invite-image{display:block;width:100%;height:auto;border-radius:5px;box-shadow:0 12px 34px #54351f30}
.hotspot{position:absolute;display:block;border:0;background:transparent;border-radius:999px;padding:0;margin:0;cursor:pointer;line-height:normal;z-index:2;outline-offset:3px}
.hotspot:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px #761810}
.hotspot:hover{background:#ffffff12}
.music-control{position:fixed;bottom:12px;left:12px;z-index:10;background:#fff7e8ef;border:1px solid #b08343;border-radius:999px;padding:7px 10px;box-shadow:0 4px 14px #54351f1c;display:flex;gap:8px;align-items:center;font-size:12px;line-height:1.3}
.music-control button{font:inherit;font-weight:bold;cursor:pointer;border:1px solid #b08343;border-radius:999px;padding:7px 10px;background:#761810;color:#fbe6b5}
.status{display:none;position:fixed;z-index:12;bottom:68px;left:10px;right:10px;max-width:600px;margin:auto;text-align:center;background:#fff9ed;border:1px solid #b08343;border-radius:10px;padding:12px;line-height:1.7;box-shadow:0 4px 20px #54351f30}
.status.show{display:block}
.dialog{display:none;position:fixed;inset:0;z-index:20;background:#21140eb8;align-items:center;justify-content:center;padding:18px;line-height:1.5}
.dialog.show{display:flex}
.dialog-card{width:min(100%,520px);background:#fff8e9;border:1px solid #b08343;border-radius:16px;color:var(--ink);padding:20px;text-align:center;box-shadow:0 20px 70px #24140d55}
.dialog-card h2{margin-top:0}
.dialog-card button{font:inherit;font-weight:bold;cursor:pointer;border:1px solid #b08343;border-radius:999px;padding:10px 16px;background:#f0dfbd;color:#542817;margin:4px}
.dialog-card img{width:100%;height:auto;border-radius:8px}
@media(max-width:480px){
main{padding:8px 7px 18px}
.screen{width:min(100%,calc((100svh - 150px)*0.743))}
.music-control{bottom:7px;left:7px;font-size:11px}
.music-control button{padding:6px 8px}
}
@media(max-height:650px){
.screen{width:min(100%,calc((100svh - 100px)*0.743))}
main{padding-top:6px;padding-bottom:6px}
}
</style>
</head>
<body>
<main>
  <audio id="bgMusic" src="abdelhaleem22.mp3" preload="auto" loop></audio>

  <!-- الصفحة الأولى: غلاف الدعوة فقط. زر فتح الدعوة منطقة تفاعلية فوق الزر المرسوم في التصميم -->
  <section class="screen active" id="coverScreen" aria-label="غلاف الدعوة">
    <img class="invite-image" src="cover.png" alt="غلاف دعوة تخرج ياسمين حلمي">
    <button class="hotspot" id="openInvite" aria-label="فتح الدعوة" title="فتح الدعوة"
      style="left:29%;top:79.8%;width:43%;height:7.7%"></button>
  </section>

  <!-- الصفحة الثانية: صورة التفاصيل نفسها، والمناطق الشفافة فوق الأزرار المرسومة تعمل عند الضغط -->
  <section class="screen" id="detailsScreen" aria-label="تفاصيل الدعوة">
    <img class="invite-image" src="details.png" alt="تفاصيل حفل تخرج ياسمين حلمي">
    <button class="hotspot" id="rsvp" aria-label="تأكيد الحضور" title="تأكيد الحضور" style="left:10%;top:68.3%;width:40%;height:6.2%"></button>
    <button class="hotspot" id="share" aria-label="مشاركة الدعوة" title="مشاركة الدعوة" style="left:51%;top:68.3%;width:39%;height:6.2%"></button>
    <button class="hotspot" id="photos" aria-label="صور الحفلة" title="صور الحفلة" style="left:10%;top:76%;width:40%;height:6.2%"></button>
    <button class="hotspot" id="video" aria-label="فيديو الحفلة" title="فيديو الحفلة" style="left:51%;top:76%;width:39%;height:6.2%"></button>
    <a class="hotspot" id="locationBtn" aria-label="فتح موقع الجامعة على خرائط جوجل" title="موقع الجامعة" href="https://www.google.com/maps/search/?api=1&query=Faculty+of+Mass+Communication+Cairo+University" target="_blank" rel="noopener" style="left:63%;top:27%;width:27%;height:20%"></a>
  </section>
</main>

<div class="music-control">
  <span id="musicLabel">🎵 موسيقى الدعوة</span>
  <button type="button" id="musicToggle">تشغيل الموسيقى</button>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>

<div class="dialog" id="photoDialog" role="dialog" aria-modal="true" aria-labelledby="photoTitle">
  <div class="dialog-card">
    <h2 id="photoTitle">صور دعوة التخرج</h2>
    <img src="cover.png" alt="غلاف دعوة التخرج">
    <p>يمكنك حفظ صورة الغلاف من جهازك. صور إضافية للحفل ستُضاف لاحقًا.</p>
    <button type="button" id="closePhotos">إغلاق</button>
  </div>
</div>
<div class="dialog" id="videoDialog" role="dialog" aria-modal="true" aria-labelledby="videoTitle">
  <div class="dialog-card">
    <h2 id="videoTitle">فيديو الحفل</h2>
    <p>فيديو الحفل غير مرفق حاليًا. عند إضافة رابط الفيديو يمكن ربط هذا الزر به.</p>
    <button type="button" id="closeVideo">إغلاق</button>
  </div>
</div>

<script>
const coverScreen=document.getElementById('coverScreen');
const detailsScreen=document.getElementById('detailsScreen');
const music=document.getElementById('bgMusic');
const musicToggle=document.getElementById('musicToggle');
const musicLabel=document.getElementById('musicLabel');
const statusBox=document.getElementById('status');
function showStatus(message){statusBox.textContent=message;statusBox.classList.add('show');clearTimeout(window.statusTimer);window.statusTimer=setTimeout(()=>statusBox.classList.remove('show'),5000);}
async function playMusic(){
  try{await music.play();musicToggle.textContent='إيقاف الموسيقى';musicLabel.textContent='🎵 الموسيقى تعمل';}
  catch(e){musicToggle.textContent='اضغطي لتشغيل الموسيقى';musicLabel.textContent='🎵 اضغطي لتشغيل الموسيقى';}
}
document.getElementById('openInvite').addEventListener('click',async()=>{
  coverScreen.classList.remove('active');detailsScreen.classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
  // تشغيل الصوت مباشرة بعد ضغطة المستخدم، لتجاوز منع التشغيل التلقائي في المتصفحات.
  await playMusic();
});
musicToggle.addEventListener('click',async()=>{
  if(music.paused) await playMusic();
  else{music.pause();musicToggle.textContent='تشغيل الموسيقى';musicLabel.textContent='🎵 موسيقى الدعوة';}
});
document.getElementById('rsvp').addEventListener('click',()=>{
  const guest=prompt('اكتبي/اكتب اسمك لتأكيد الحضور:');
  if(!guest||!guest.trim())return;
  const message='مرحبًا، أؤكد حضوري حفل تخرج ياسمين حلمي من كلية الإعلام – جامعة القاهرة. الاسم: '+guest.trim();
  window.open('https://wa.me/?text='+encodeURIComponent(message),'_blank','noopener');
  showStatus('تم تجهيز رسالة تأكيد الحضور في واتساب. اضغط إرسال لإتمام التأكيد.');
});
async function copyText(text){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);
  const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
  const ok=document.execCommand('copy');area.remove();if(!ok)throw new Error('copy failed');
}
document.getElementById('share').addEventListener('click',async()=>{
  const data={title:'دعوة تخرج ياسمين حلمي',text:'يسعدنا دعوتكم لمشاركة ياسمين حلمي فرحة التخرج من كلية الإعلام – جامعة القاهرة.',url:location.href};
  try{if(navigator.share)await navigator.share(data);else{await copyText(data.text+' '+data.url);showStatus('تم نسخ نص الدعوة والرابط، ويمكنك مشاركتهما الآن.');}}
  catch(e){if(e.name!=='AbortError')showStatus('يمكنك استخدام زر المشاركة في جهازك أو نسخ رابط الصفحة.');}
});
const photoDialog=document.getElementById('photoDialog');
const videoDialog=document.getElementById('videoDialog');
document.getElementById('photos').addEventListener('click',()=>photoDialog.classList.add('show'));
document.getElementById('closePhotos').addEventListener('click',()=>photoDialog.classList.remove('show'));
document.getElementById('video').addEventListener('click',()=>videoDialog.classList.add('show'));
document.getElementById('closeVideo').addEventListener('click',()=>videoDialog.classList.remove('show'));
[photoDialog,videoDialog].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.classList.remove('show');}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){photoDialog.classList.remove('show');videoDialog.classList.remove('show');}});
</script>
</body>
</html>
